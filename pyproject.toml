[project]
name = "fuzzy-system-research"
version = "0.1.0"
description = "Backend for fuzzy-system-finance: ARIMA stock price models and portfolio optimization, uploaded to an S3-compatible bucket."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "dask[distributed]",
    "h5py",
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "openpyxl",
    "pandas",
    "pandas-datareader",
    "plotly",
    "polygon-api-client",
    "python-dateutil",
    "python-dotenv",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "tables",
    "tqdm",
]

[dependency-groups]
dev = [
    "black[jupyter]",
    "flake8",
    "pytest",
    "sphinx",
]

[tool.uv]
# The scripts live flat in the repo root and are run directly, so this
# project is an environment only, not an installable package.
package = false
