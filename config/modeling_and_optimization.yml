# Settings for the backend's models and optimization, read by
# scripts/run_optimization_and_time_series.py (override the path with --config).
#
# Every key is required and unknown keys are rejected, so a typo fails the run
# instead of silently using a default.
#
# Changing a value changes what is uploaded (see INTERFACE_CONTRACT.md): re-run
# with --retrain-arima, because cached forecasts for a date are otherwise reused,
# and update the contract wherever it documents the value.
time_series_models:
  # Closing prices (NYSE trading sessions) in each ARIMA training window, ending
  # on the session before the forecast date. 252 closes = 251 daily log returns,
  # one trading year. At least 30.
  training_window_length: 252
  # Most recent trading days with an actual close that are backtested and scored
  # in all_forecasts_metadata.yml: one forecast each, plus the live forecast. At
  # least 1.
  evaluation_window_length: 20
