# Settings for the backend's models and optimization, read by
# scripts/run_optimization_and_time_series.py (override the path with --config).
#
# Every key is required and unknown keys are rejected, so a typo fails the run
# instead of silently using a default. Types and minimum values are checked by
# src/fuzzy_system_research/config.py.
#
# Changing a value changes what is uploaded. For time_series_models, re-run
# with --retrain-arima, because cached forecasts for a date are otherwise
# reused; the optimization is recomputed on every run. Each run records the
# time series values it used in all_forecasts_metadata.yml, where the frontend
# reads them, so docs/INTERFACE_CONTRACT.md needs no update unless a setting's
# meaning changes.
time_series_models:
  # Closing prices (NYSE trading sessions) in each ARIMA training window, ending
  # on the session before the forecast date. A window of N closes holds N - 1
  # daily log returns.
  training_window_length: 252
  # Most recent trading days with an actual close that are backtested and scored
  # in all_forecasts_metadata.yml: one forecast each, plus the live forecast.
  evaluation_window_length: 60
portfolio_optimization:
  # Per-ticker weight cap, as a multiple of the equal weight: each weight is at
  # most weight_cap_multiple / (number of tickers). Applies to the max Sharpe
  # ratio and minimum variance portfolios, the efficient frontier, and the
  # random portfolios alike. Must be greater than 1 (at 1 the only feasible
  # portfolio is equal weights); at or above the number of tickers the cap
  # never binds. An integer or a decimal number.
  weight_cap_multiple: 4
  # Target returns on the efficient frontier (the length of efficient_frontier
  # in portfolio_optimization_plot_data.h5). At least 2.
  efficient_frontier_points: 100
  # Random portfolios drawn from the constraint set (the length of
  # simulated_portfolios in the .h5 file). At least 1.
  simulated_portfolios: 10000
  # Seed of the random number generator for the random portfolios, so a re-run
  # on the same data draws the same cloud. A non-negative integer.
  random_seed: 20261025
